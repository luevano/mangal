name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    env:
      GOFLAGS: -mod=readonly
      # the released modules, as go install builds it
      GOWORK: "off"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      # the web UI is only embedded with the webui tag, it isn't committed
      - name: Build with the web UI
        run: cd web/ui && npm ci && npm run build-only && cd ../.. && go build -tags webui ./...

      # go generate (enumer) and web/generate.sh (oapi-codegen, openapi-typescript) are
      # pinned: what they write has to be committed
      - name: Generated files are up to date
        if: runner.os == 'Linux'
        run: |
          go generate ./...
          ./web/generate.sh
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -v ./...
        if: runner.os != 'Windows'

      - name: Test (without race detector)
        run: go test -v ./...
        if: runner.os == 'Windows'


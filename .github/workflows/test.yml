name: Test

on:
  push:
    branches:
      - main
  pull_request:

# the job token only reads the repo
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    env:
      GOFLAGS: -mod=readonly
      # the released modules, as go install builds it
      GOWORK: "off"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      # the web UI is only embedded with the webui tag, it isn't committed
      - name: Build with the web UI
        run: cd web/ui && npm ci && npm run build-only && cd ../.. && go build -tags webui ./...

      # go generate (enumer) and web/generate.sh (oapi-codegen, openapi-typescript) are
      # pinned: what they write has to be committed
      - name: Generated files are up to date
        if: runner.os == 'Linux'
        run: |
          go generate ./...
          ./web/generate.sh
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -v ./...
        if: runner.os != 'Windows'

      - name: Test (without race detector)
        run: go test -v ./...
        if: runner.os == 'Windows'


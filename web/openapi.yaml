openapi: "3.0.0"
info:
  version: 1.0.0
  title: mangal API
  description: |
    The HTTP API v1 of `mangal serve` and `mangal web` under /api/v1 (tag v1). Paths are
    relative to /api. Every v1 operation has an x-mangal-scope (read, watch, progress or write):
    the permission it needs (a user's, or an API token's scope); the plan/apply ones
    (x-mangal-plan) need it only with apply=1, a plan needs read; public ones (the login)
    need none. A request is a user's (the session cookie of POST /v1/auth/login, or basic
    auth with the user's name and password) or an API token's (Authorization: Bearer).
servers:
  - url: /api
paths:
  /v1/:
    get:
      summary: The operations of the API v1
      operationId: getIndex
      tags: [v1, meta]
      x-mangal-scope: read
      responses:
        '200':
          description: the API version and every operation with its scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Index'
        default:
          $ref: '#/components/responses/Error'
  /v1/openapi.yaml:
    get:
      summary: This spec
      operationId: getSpec
      tags: [v1, meta]
      x-mangal-scope: read
      responses:
        '200':
          description: the OpenAPI spec of the API
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /v1/status:
    get:
      summary: The server, its checks, the API version and features
      description: Also GET /api/status (what watch.Remote reads).
      operationId: getStatus
      tags: [v1, meta]
      x-mangal-scope: read
      responses:
        '200':
          description: the status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/login:
    post:
      summary: Log in, the session cookie is set
      description: |
        Starts a session for the user (the mangal_session cookie, HttpOnly, SameSite=Lax);
        remember keeps it for serve.session_lifetime, else until the browser closes. Failed
        logins are rate limited (429 with Retry-After).
      operationId: login
      tags: [v1, auth]
      x-mangal-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: who is logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/logout:
    post:
      summary: Log out, the session ends
      operationId: logout
      tags: [v1, auth]
      x-mangal-scope: public
      responses:
        '204':
          description: logged out
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/me:
    get:
      summary: Who the request is (401 when nobody)
      operationId: getMe
      tags: [v1, auth]
      x-mangal-scope: public
      responses:
        '200':
          description: the user, the API token or the server's own CLI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        default:
          $ref: '#/components/responses/Error'
  /v1/users:
    get:
      summary: The users who log in
      description: Needs every permission (an admin), whatever its x-mangal-scope says.
      operationId: listUsers
      tags: [v1, auth]
      x-mangal-scope: read
      responses:
        '200':
          description: the users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Add a user
      description: |
        No perms gives the first user every one, the others read and progress. Needs every permission (an admin), whatever its x-mangal-scope says.
      operationId: addUser
      tags: [v1, auth]
      x-mangal-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'
  /v1/users/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    patch:
      summary: Change a user's password or permissions (their logins end)
      description: |
        The last user with every permission keeps them (409). Needs every permission (an admin), whatever its x-mangal-scope says.
      operationId: updateUser
      tags: [v1, auth]
      x-mangal-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserChange'
      responses:
        '204':
          description: changed
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Remove a user
      description: The last user with every permission stays (409). Needs every permission (an admin), whatever its x-mangal-scope says.
      operationId: removeUser
      tags: [v1, auth]
      x-mangal-scope: write
      responses:
        '204':
          description: removed
        default:
          $ref: '#/components/responses/Error'
  /v1/users/{name}/logout:
    post:
      summary: End a user's logins (every browser and app)
      description: Needs every permission (an admin), whatever its x-mangal-scope says.
      operationId: endUserLogins
      tags: [v1, auth]
      x-mangal-scope: write
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: ended
        default:
          $ref: '#/components/responses/Error'
  /v1/tokens:
    get:
      summary: The API tokens (without their secrets)
      description: Needs every permission (an admin), whatever its x-mangal-scope says.
      operationId: listTokens
      tags: [v1, auth]
      x-mangal-scope: read
      responses:
        '200':
          description: the tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Token'
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Make an API token, its secret is only in this answer
      description: No scopes is read. Needs every permission (an admin), whatever its x-mangal-scope says.
      operationId: addToken
      tags: [v1, auth]
      x-mangal-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewToken'
      responses:
        '201':
          description: the token and its secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewTokenResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/tokens/{name}:
    delete:
      summary: Remove an API token
      description: Needs every permission (an admin), whatever its x-mangal-scope says.
      operationId: removeToken
      tags: [v1, auth]
      x-mangal-scope: write
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: removed
        default:
          $ref: '#/components/responses/Error'
  /v1/events:
    get:
      summary: Server-sent events of the topics
      description: |
        `id:` is the event's seq, `data:` the Event JSON, `: ping` every 30 s. The recent
        events come first, after `since` or Last-Event-ID. A subscriber too far behind is
        disconnected (it reconnects from its last seq). GET /api/events stays the watch
        events only, as watch.LiveEvent (watch.Remote).
      operationId: getEvents
      tags: [v1, meta]
      x-mangal-scope: read
      parameters:
        - name: topics
          in: query
          description: comma separated, every topic when empty
          schema:
            type: string
            example: watch,job,op,health,log
        - name: since
          in: query
          description: the seq of the last event seen
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: the event stream
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'

  /v1/library/mangas:
    get:
      summary: The library's mangas
      operationId: listLibraryMangas
      tags: [v1, library]
      x-mangal-scope: read
      parameters:
        - name: q
          in: query
          description: a text the title, the folder or a source's title has (any case)
          schema:
            type: string
        - name: status
          in: query
          description: publication status (finished, releasing, hiatus, cancelled, not_yet_released; unknown for none)
          schema:
            type: string
        - name: provider
          in: query
          description: only the mangas with a source of this provider
          schema:
            type: string
        - name: duplicates
          in: query
          description: only the mangas sharing a metadata id with another
          schema:
            type: boolean
        - name: watched
          in: query
          description: only the watched mangas (true) or the others (false)
          schema:
            type: boolean
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: the mangas, by title
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryMangaList'
        default:
          $ref: '#/components/responses/Error'
  /v1/library/mangas/{id}:
    get:
      summary: A library manga with its bindings, watches and marker
      operationId: getLibraryManga
      tags: [v1, library]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: the manga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryMangaDetail'
        default:
          $ref: '#/components/responses/Error'
  /v1/library/mangas/{id}/hold:
    post:
      summary: Mark a library manga on hold or as needing another provider
      description: hiatus and ended check the watches once more (synchronously, unless no_check), then pause them; provider marks them as needing another provider; an empty mark clears the marks and resumes the watches the hold paused.
      operationId: holdLibraryManga
      tags: [v1, library]
      x-mangal-scope: watch
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldRequest'
      responses:
        '200':
          description: what was marked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldResult'
        default:
          $ref: '#/components/responses/Error'
  /v1/library/mangas/{id}/retitle:
    post:
      summary: Give a library manga's chapters the titles another provider's manga has
      description: The titles of the provider's manga (the library manga's current source's by default) for the same chapter numbers, every chapter listed (unavailable and retired ones too); the files get the names the chapter name template gives and, zips with a ComicInfo.xml, its Title (the originals go to the trash).
      operationId: retitleLibraryManga
      tags: [v1, library, changes]
      x-mangal-scope: write
      x-mangal-plan: true
      parameters:
        - $ref: '#/components/parameters/IDParam'
        - $ref: '#/components/parameters/ApplyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetitleRequest'
      responses:
        '200':
          $ref: '#/components/responses/Change'
        default:
          $ref: '#/components/responses/Error'
  /v1/library/mangas/{id}/source-url:
    get:
      summary: The web page of a library manga's source
      description: The recorded url, else (or with refresh) the one the provider gives for the manga id, recorded then; read scope, as the recording is a cache of what the provider says. A source the provider doesn't have (any more) is a 404 and is marked gone (its last url kept in the source's url, gone set); until a refresh or a download finds it again that's the answer without asking the provider.
      operationId: getLibrarySourceURL
      tags: [v1, library]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/IDParam'
        - name: provider
          in: query
          required: true
          description: the source's provider id
          schema:
            type: string
        - $ref: '#/components/parameters/MangaIDRequiredParam'
        - name: refresh
          in: query
          description: ask the provider even when a url is recorded (a stale one) or the source is gone
          schema:
            type: boolean
      responses:
        '200':
          description: the url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceURL'
        default:
          $ref: '#/components/responses/Error'
  /v1/library/mangas/{id}/chapters:
    get:
      summary: A library manga's downloaded chapters, with how often each was read
      operationId: listLibraryChapters
      tags: [v1, library]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: the chapters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryChapter'
        default:
          $ref: '#/components/responses/Error'
  /v1/library/mangas/{id}/cover:
    get:
      summary: A library manga's cover (cover.jpg, .png, .webp in its folder)
      operationId: getLibraryCover
      tags: [v1, library, reader]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: the cover
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            image/*:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
  /v1/library/mangas/{id}/pages:
    get:
      summary: The pages of a downloaded chapter, read from its file (no extraction)
      description: |
        CBZ, ZIP, TAR, TAR.GZ and folders of images have pages; a PDF has none (`pdf`),
        it's read whole from getChapterFile.
      operationId: listChapterPages
      tags: [v1, library, reader]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/IDParam'
        - $ref: '#/components/parameters/ChapterPathParam'
      responses:
        '200':
          description: the pages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterPages'
        default:
          $ref: '#/components/responses/Error'
  /v1/library/mangas/{id}/pages/{page}:
    get:
      summary: A page of a downloaded chapter (0-based)
      operationId: getChapterPage
      tags: [v1, library, reader]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/IDParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/ChapterPathParam'
      responses:
        '200':
          description: the page's image
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            image/*:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
  /v1/library/mangas/{id}/file:
    get:
      summary: A downloaded chapter's file (a folder of images as a zip)
      operationId: getChapterFile
      tags: [v1, library, reader]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/IDParam'
        - $ref: '#/components/parameters/ChapterPathParam'
        - name: inline
          in: query
          description: shown in the browser (a PDF), not saved
          schema:
            type: boolean
      responses:
        '200':
          description: the file
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
  /v1/library/mangas/{id}/zip:
    get:
      summary: Every downloaded chapter of a library manga in one zip
      description: Streamed (stored, not compressed again), the chapter files under their names in the manga's folder; a folder of images is zipped inside.
      operationId: getLibraryMangaZip
      tags: [v1, library, reader]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: the zip
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
  /v1/library/downloads:
    get:
      summary: The downloaded chapters, newest first
      operationId: listDownloads
      tags: [v1, library]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/ProviderParam'
        - $ref: '#/components/parameters/MangaIDParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: the downloads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadList'
        default:
          $ref: '#/components/responses/Error'
  /v1/library/duplicates:
    get:
      summary: The library mangas sharing a metadata id (to merge)
      operationId: listDuplicates
      tags: [v1, library]
      x-mangal-scope: read
      responses:
        '200':
          description: the duplicates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Duplicate'
        default:
          $ref: '#/components/responses/Error'
  /v1/library/trash:
    get:
      summary: What's in the trash
      operationId: getTrash
      tags: [v1, library]
      x-mangal-scope: read
      responses:
        '200':
          description: the trash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trash'
        default:
          $ref: '#/components/responses/Error'
  /v1/library/scan:
    post:
      summary: Scan the download directory (a job)
      description: Reconciles the library with the files (rows only, as a download does). Answers 202 with the job.
      operationId: scanLibrary
      tags: [v1, library]
      x-mangal-scope: write
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
      responses:
        '202':
          description: the scan's job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'
  /v1/library/urls:
    post:
      summary: Look the web pages of the library's sources up (a job)
      description: The sources without a url (and not gone), or all of them (stale urls refreshed, gone ones asked again); a provider is asked one manga at a time with a pause of jobs.delay_min to jobs.delay_max, watch.parallel_providers providers at once, the providers not installed or off in jobs.urls.providers skipped. Answers 202 with the job.
      operationId: lookupSourceURLs
      tags: [v1, library]
      x-mangal-scope: write
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceURLsRequest'
      responses:
        '202':
          description: the lookup's job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'
  /v1/library/merge:
    post:
      summary: Merge a library manga into another
      operationId: mergeLibraryMangas
      tags: [v1, library, changes]
      x-mangal-scope: write
      x-mangal-plan: true
      parameters:
        - $ref: '#/components/parameters/ApplyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeRequest'
      responses:
        '200':
          $ref: '#/components/responses/Change'
        default:
          $ref: '#/components/responses/Error'
  /v1/library/move:
    post:
      summary: Move a library manga to another provider's manga
      operationId: moveLibraryManga
      tags: [v1, library, changes]
      x-mangal-scope: write
      x-mangal-plan: true
      parameters:
        - $ref: '#/components/parameters/ApplyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
      responses:
        '200':
          $ref: '#/components/responses/Change'
        default:
          $ref: '#/components/responses/Error'
  /v1/library/links:
    post:
      summary: Set a library manga's metadata links
      operationId: linkLibraryManga
      tags: [v1, library, changes]
      x-mangal-scope: write
      x-mangal-plan: true
      parameters:
        - $ref: '#/components/parameters/ApplyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkRequest'
      responses:
        '200':
          $ref: '#/components/responses/Change'
        default:
          $ref: '#/components/responses/Error'
  /v1/library/backups:
    post:
      summary: Fill the Kitsu and MyAnimeList links of mangas linked to AniList
      operationId: fillBackupLinks
      tags: [v1, library, changes]
      x-mangal-scope: write
      x-mangal-plan: true
      parameters:
        - $ref: '#/components/parameters/ApplyParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupsRequest'
      responses:
        '200':
          $ref: '#/components/responses/Change'
        default:
          $ref: '#/components/responses/Error'
  /v1/library/mark:
    post:
      summary: Write the .libmangal.json of folders without one
      operationId: markLibraryMangas
      tags: [v1, library, changes]
      x-mangal-scope: write
      x-mangal-plan: true
      parameters:
        - $ref: '#/components/parameters/ApplyParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkRequest'
      responses:
        '200':
          $ref: '#/components/responses/Change'
        default:
          $ref: '#/components/responses/Error'
  /v1/library/rename:
    post:
      summary: Rename the library's folders (and chapters) to the name templates
      operationId: renameLibrary
      tags: [v1, library, changes]
      x-mangal-scope: write
      x-mangal-plan: true
      parameters:
        - $ref: '#/components/parameters/ApplyParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameRequest'
      responses:
        '200':
          $ref: '#/components/responses/Change'
        default:
          $ref: '#/components/responses/Error'
  /v1/library/forget:
    post:
      summary: Forget library mangas (rows only, the files stay)
      operationId: forgetLibraryMangas
      tags: [v1, library, changes]
      x-mangal-scope: write
      x-mangal-plan: true
      parameters:
        - $ref: '#/components/parameters/ApplyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgetRequest'
      responses:
        '200':
          $ref: '#/components/responses/Change'
        default:
          $ref: '#/components/responses/Error'
  /v1/library/delete:
    post:
      summary: Delete a library manga or one of its chapters (to the trash)
      operationId: deleteLibraryManga
      tags: [v1, library, changes]
      x-mangal-scope: write
      x-mangal-plan: true
      parameters:
        - $ref: '#/components/parameters/ApplyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
      responses:
        '200':
          $ref: '#/components/responses/Change'
        default:
          $ref: '#/components/responses/Error'
  /v1/library/trash/empty:
    post:
      summary: Empty the trash (irreversible)
      description: Applying needs `"confirm":"empty-trash"` too, else 428 confirm_required.
      operationId: emptyTrash
      tags: [v1, library, changes]
      x-mangal-scope: write
      x-mangal-plan: true
      parameters:
        - $ref: '#/components/parameters/ApplyParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyFields'
      responses:
        '200':
          $ref: '#/components/responses/Change'
        default:
          $ref: '#/components/responses/Error'
  /v1/library/migrate:
    post:
      summary: Migrate the library's old provider ids
      operationId: migrateLibrary
      tags: [v1, library, changes]
      x-mangal-scope: write
      x-mangal-plan: true
      parameters:
        - $ref: '#/components/parameters/ApplyParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyFields'
      responses:
        '200':
          $ref: '#/components/responses/Change'
        default:
          $ref: '#/components/responses/Error'

  /v1/ops:
    get:
      summary: The journal's operations, newest first
      operationId: listOps
      tags: [v1, library]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: the operations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Op'
        default:
          $ref: '#/components/responses/Error'
  /v1/ops/{id}/undo:
    post:
      summary: Undo an operation
      description: A forced undo (force, when the plan is forceable) loses what it blocks, it needs `"confirm":"force-undo"` too.
      operationId: undoOp
      tags: [v1, library, changes]
      x-mangal-scope: write
      x-mangal-plan: true
      parameters:
        - $ref: '#/components/parameters/IDParam'
        - $ref: '#/components/parameters/ApplyParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyFields'
      responses:
        '200':
          $ref: '#/components/responses/Change'
        default:
          $ref: '#/components/responses/Error'

  /v1/health:
    get:
      summary: The health report (offline checks), or a job with the network ones
      description: Also GET /api/health.
      operationId: getHealth
      tags: [v1, health]
      x-mangal-scope: read
      parameters:
        - name: only
          in: query
          description: comma separated checks or categories
          schema:
            type: string
        - name: all
          in: query
          description: also the dismissed findings
          schema:
            type: boolean
        - name: network
          in: query
          description: with the network checks, as a job (202)
          schema:
            type: boolean
      responses:
        '200':
          description: the report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
        '202':
          description: the network job (Location has its url)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthJob'
        default:
          $ref: '#/components/responses/Error'
  /v1/health/jobs/{id}:
    get:
      summary: A health job, with its report once done
      operationId: getHealthJob
      tags: [v1, health]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: the job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthJob'
        default:
          $ref: '#/components/responses/Error'
  /v1/health/fix:
    post:
      summary: Fix a finding (by key)
      description: |
        The finding is looked up now (an offline run of its check, else the last network
        job's report). 422 for a finding without a fix that can be applied here (a merge
        without a choice, a scan).
      operationId: fixHealthFinding
      tags: [v1, health, changes]
      x-mangal-scope: write
      x-mangal-plan: true
      parameters:
        - $ref: '#/components/parameters/ApplyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthFixRequest'
      responses:
        '200':
          $ref: '#/components/responses/Change'
        default:
          $ref: '#/components/responses/Error'
  /v1/health/dismiss:
    post:
      summary: Dismiss findings (fine as they are) or bring them back
      operationId: dismissHealthFindings
      tags: [v1, health]
      x-mangal-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DismissRequest'
      responses:
        '200':
          description: what was dismissed and undismissed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DismissResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/jobs:
    get:
      summary: The server's jobs (downloads, scans), the running and queued first
      operationId: listJobs
      tags: [v1, jobs]
      x-mangal-scope: read
      responses:
        '200':
          description: the jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'
  /v1/jobs/clear:
    post:
      summary: Cancel the queued jobs (of a provider)
      operationId: clearJobQueue
      tags: [v1, jobs]
      x-mangal-scope: write
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClearJobsRequest'
      responses:
        '200':
          description: how many were cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'
        default:
          $ref: '#/components/responses/Error'
  /v1/jobs/kinds:
    get:
      summary: The maintenance job kinds (the Jobs page), with their state
      description: Watch checks (check), source checks (sources, health L11), source addresses (urls), the library scan (scan) and the network health checks (health); each with its schedule, last and next run, its running job and per-provider settings (without their counts, GET /v1/jobs/kinds/{kind} has them).
      operationId: listJobKinds
      tags: [v1, jobs]
      x-mangal-scope: read
      responses:
        '200':
          description: the kinds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobKind'
        default:
          $ref: '#/components/responses/Error'
  /v1/jobs/kinds/{kind}:
    get:
      summary: A job kind with its per-provider counts
      operationId: getJobKind
      tags: [v1, jobs]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/KindParam'
      responses:
        '200':
          description: the kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobKind'
        default:
          $ref: '#/components/responses/Error'
  /v1/jobs/kinds/{kind}/run:
    post:
      summary: Run a job kind now (a job)
      description: Only the missing items (the due watches, the sources not checked within their interval, those without an address; the scan and the network health check do everything), or all of them. The providers off for the kind are skipped. 409 refused while one runs, 409 nothing_to_do when nothing is missing.
      operationId: runJobKind
      tags: [v1, jobs]
      x-mangal-scope: write
      parameters:
        - $ref: '#/components/parameters/KindParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobKindRunRequest'
      responses:
        '202':
          description: the job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'
  /v1/jobs/kinds/{kind}/pause:
    post:
      summary: Pause a job kind's schedule (a running job goes on)
      operationId: pauseJobKind
      tags: [v1, jobs]
      x-mangal-scope: write
      parameters:
        - $ref: '#/components/parameters/KindParam'
      responses:
        '200':
          description: the kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobKind'
        default:
          $ref: '#/components/responses/Error'
  /v1/jobs/kinds/{kind}/resume:
    post:
      summary: Resume a job kind's schedule
      operationId: resumeJobKind
      tags: [v1, jobs]
      x-mangal-scope: write
      parameters:
        - $ref: '#/components/parameters/KindParam'
      responses:
        '200':
          description: the kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobKind'
        default:
          $ref: '#/components/responses/Error'
  /v1/jobs/kinds/{kind}/settings:
    put:
      summary: Change a job kind's settings (in the config file)
      description: enabled, schedule (its config key's value), per-provider on, off or an interval (empty for the prebuilt default), and the pause between requests (shared by the kinds). Needs every permission (an admin), whatever its x-mangal-scope says.
      operationId: setJobKindSettings
      tags: [v1, jobs]
      x-mangal-scope: write
      parameters:
        - $ref: '#/components/parameters/KindParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobSettings'
      responses:
        '200':
          description: the kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobKind'
        default:
          $ref: '#/components/responses/Error'
  /v1/jobs/{id}:
    get:
      summary: A job
      operationId: getJob
      tags: [v1, jobs]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: the job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Remove a finished job from the list
      operationId: removeJob
      tags: [v1, jobs]
      x-mangal-scope: write
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '204':
          description: removed
        default:
          $ref: '#/components/responses/Error'
  /v1/jobs/{id}/cancel:
    post:
      summary: Cancel a queued or running job
      operationId: cancelJob
      tags: [v1, jobs]
      x-mangal-scope: write
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '202':
          description: cancelled (a running one stops soon)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'
  /v1/jobs/{id}/retry:
    post:
      summary: Retry a finished download's failed chapters, as a new job
      operationId: retryJob
      tags: [v1, jobs]
      x-mangal-scope: write
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '202':
          description: the new job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'
  /v1/downloads:
    post:
      summary: Download chapters of a provider's manga (a job)
      operationId: startDownload
      tags: [v1, jobs]
      x-mangal-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadRequest'
      responses:
        '202':
          description: the download's job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /v1/logs:
    get:
      summary: The log files' entries, oldest first (the last `limit`)
      operationId: listLogs
      tags: [v1, logs]
      x-mangal-scope: read
      parameters:
        - name: since
          in: query
          description: a time (RFC 3339) or a duration ago (30m, 7d)
          schema:
            type: string
        - name: until
          in: query
          description: a time (RFC 3339) or a duration ago
          schema:
            type: string
        - name: level
          in: query
          description: the lowest level (debug, info, warn, error)
          schema:
            type: string
        - name: grep
          in: query
          description: a regexp the message matches (case-insensitive unless it has a capital)
          schema:
            type: string
        - name: file
          in: query
          description: only this file (a name of /v1/logs/files)
          schema:
            type: string
        - $ref: '#/components/parameters/LogLimitParam'
      responses:
        '200':
          description: the entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogEntry'
        default:
          $ref: '#/components/responses/Error'
  /v1/logs/files:
    get:
      summary: The log files, oldest first
      operationId: listLogFiles
      tags: [v1, logs]
      x-mangal-scope: read
      responses:
        '200':
          description: the files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogFile'
        default:
          $ref: '#/components/responses/Error'

  /v1/providers:
    get:
      summary: The installed providers
      operationId: listProviders
      tags: [v1, providers]
      x-mangal-scope: read
      responses:
        '200':
          description: the providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Provider'
        default:
          $ref: '#/components/responses/Error'
  /v1/providers/update:
    post:
      summary: Update the installed providers (git pull of each)
      description: Only the providers already installed, from their own remotes (https, ssh, file); installing a provider has no endpoint. The providers are loaded again after.
      operationId: updateProviders
      tags: [v1, providers]
      x-mangal-scope: write
      responses:
        '200':
          description: what each provider directory did
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvidersUpdate'
        default:
          $ref: '#/components/responses/Error'
  /v1/providers/{provider}/mirror:
    put:
      summary: Set the provider's preferred website (providers.mirrors)
      description: Its website or one of its mirrors; empty or the website itself goes back to the default. The mirror that last worked is forgotten and the providers loaded again.
      operationId: setProviderMirror
      tags: [v1, providers]
      x-mangal-scope: write
      parameters:
        - $ref: '#/components/parameters/ProviderPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MirrorRequest'
      responses:
        '200':
          description: the provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        default:
          $ref: '#/components/responses/Error'
  /v1/providers/{provider}:
    get:
      summary: A provider (an old id of it works too)
      operationId: getProviderInfo
      tags: [v1, providers]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/ProviderPathParam'
      responses:
        '200':
          description: the provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        default:
          $ref: '#/components/responses/Error'
  /v1/providers/{provider}/icon:
    get:
      summary: The provider's site icon
      description: Its icon, else its website's /favicon.ico, fetched once and kept in the cache dir (raster images only). A site without one is a 404, asked again after a day.
      operationId: getProviderIcon
      tags: [v1, providers]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/ProviderPathParam'
      responses:
        '200':
          description: the icon
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            image/*:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
  /v1/providers/{provider}/search:
    get:
      summary: Search a provider's mangas
      operationId: searchProvider
      tags: [v1, providers]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/ProviderPathParam'
        - name: q
          in: query
          description: the title to search (a `mid:<id>` one is the id, deprecated)
          schema:
            type: string
        - name: id
          in: query
          description: the manga's id instead of `q`, gets that manga (MangaByID)
          schema:
            type: string
      responses:
        '200':
          description: the mangas found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Manga'
        default:
          $ref: '#/components/responses/Error'
  /v1/providers/{provider}/manga:
    get:
      summary: A provider's manga by id
      description: By the provider's id lookup (MangaByID), or a search of `q` picking the manga with the id.
      operationId: getProviderManga
      tags: [v1, providers]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/ProviderPathParam'
        - $ref: '#/components/parameters/MangaIDRequiredParam'
        - name: q
          in: query
          description: a title to search when the provider can't get a manga by id
          schema:
            type: string
      responses:
        '200':
          description: the manga, its watch and bindings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderManga'
        default:
          $ref: '#/components/responses/Error'
  /v1/providers/{provider}/chapters:
    get:
      summary: A provider's manga's chapters, with what the library has
      operationId: listProviderChapters
      tags: [v1, providers]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/ProviderPathParam'
        - $ref: '#/components/parameters/MangaIDRequiredParam'
        - name: q
          in: query
          description: a title to search when the provider can't get a manga by id
          schema:
            type: string
      responses:
        '200':
          description: the chapters, by volume and number
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderChapter'
        default:
          $ref: '#/components/responses/Error'
  /v1/providers/{provider}/fill:
    post:
      summary: Get a provider's manga's unavailable chapters from another provider (a job)
      description: The manga's chapter numbers it can't download and its folder doesn't have, matched by number on the other provider's manga (the first available chapter with the number). Applied, a download job of the other provider gets them into the manga's folder with the manga's titles and series metadata, recorded as the other provider's downloads; the folder's source stays the manga's.
      operationId: fillProviderManga
      tags: [v1, providers, jobs]
      x-mangal-scope: write
      x-mangal-plan: true
      parameters:
        - $ref: '#/components/parameters/ProviderPathParam'
        - name: apply
          in: query
          description: start the job, else only plan it
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FillRequest'
      responses:
        '200':
          description: the plan, and the job when applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FillPlan'
        default:
          $ref: '#/components/responses/Error'
  /v1/providers/{provider}/pages:
    get:
      summary: The pages of a provider's chapter (read online)
      description: The pages are kept a while; getProviderPage gets each through the provider (its headers, its rate limit).
      operationId: listProviderPages
      tags: [v1, providers, reader]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/ProviderPathParam'
        - $ref: '#/components/parameters/MangaIDRequiredParam'
        - $ref: '#/components/parameters/ChapterNumberParam'
        - $ref: '#/components/parameters/VolumeNumberParam'
      responses:
        '200':
          description: the pages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterPages'
        default:
          $ref: '#/components/responses/Error'
  /v1/providers/{provider}/pages/{page}:
    get:
      summary: A page of a provider's chapter (0-based)
      operationId: getProviderPage
      tags: [v1, providers, reader]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/ProviderPathParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/MangaIDRequiredParam'
        - $ref: '#/components/parameters/ChapterNumberParam'
        - $ref: '#/components/parameters/VolumeNumberParam'
      responses:
        '200':
          description: the page's image
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            image/*:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
  /v1/reads:
    post:
      summary: Record a chapter read in the web reader
      description: |
        Records it in the read history (read.history.local) and sets the reading progress
        on AniList, Kitsu and MyAnimeList (read.history.*, logged in; the manga's bindings,
        else the library manga's ids), like the TUI's read. The reader skips it in incognito.
      operationId: recordRead
      tags: [v1, reader]
      x-mangal-scope: progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadRequest'
      responses:
        '200':
          description: what was recorded and synced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/reader/position:
    get:
      summary: The page a chapter was left on in the web reader
      description: |
        Saved by putReaderPosition from any device; the reader takes the newer of this and
        the browser's own.
      operationId: getReaderPosition
      tags: [v1, reader]
      x-mangal-scope: read
      parameters:
        - name: chapter
          in: query
          required: true
          description: the reader's chapter key
          schema:
            type: string
      responses:
        '200':
          description: the position, found false if none was saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderPosition'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Save the page a chapter is on in the web reader
      description: |
        Kept unless a newer position is saved (updated). The reader skips it in incognito.
      operationId: putReaderPosition
      tags: [v1, reader]
      x-mangal-scope: progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReaderPosition'
      responses:
        '200':
          description: the position saved (a newer one if another device moved on)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderPosition'
        default:
          $ref: '#/components/responses/Error'
  /v1/formats:
    get:
      summary: The download formats
      operationId: listFormats
      tags: [v1, providers]
      x-mangal-scope: read
      responses:
        '200':
          description: the formats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Format'
        default:
          $ref: '#/components/responses/Error'
  /v1/image:
    get:
      summary: An image of a public http(s) url (raster images only)
      operationId: proxyImage
      tags: [v1, providers]
      x-mangal-scope: read
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
        - name: referer
          in: query
          schema:
            type: string
      responses:
        '200':
          description: the image
          content:
            image/*:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'

  /v1/bindings:
    get:
      summary: The metadata bindings (of a provider, or its manga)
      operationId: listBindings
      tags: [v1, bindings]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/ProviderParam'
        - $ref: '#/components/parameters/MangaIDParam'
      responses:
        '200':
          description: the bindings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Binding'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Bind a provider's manga to a metadata id
      operationId: setBinding
      tags: [v1, bindings, changes]
      x-mangal-scope: write
      x-mangal-plan: true
      parameters:
        - $ref: '#/components/parameters/ApplyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindRequest'
      responses:
        '200':
          $ref: '#/components/responses/Change'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Remove a binding
      operationId: removeBinding
      tags: [v1, bindings, changes]
      x-mangal-scope: write
      x-mangal-plan: true
      parameters:
        - $ref: '#/components/parameters/ApplyParam'
        - name: provider
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/MangaIDRequiredParam'
        - name: source
          in: query
          required: true
          description: the metadata source's code (al, kt, mal)
          schema:
            type: string
        - name: expect
          in: query
          description: the hash of the plan confirmed (needed with apply)
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Change'
        default:
          $ref: '#/components/responses/Error'

  /v1/metadata/sources:
    get:
      summary: The metadata sources mangas are bound or linked to (AniList, Kitsu, MyAnimeList)
      operationId: listMetadataSources
      tags: [v1, metadata]
      x-mangal-scope: read
      responses:
        '200':
          description: the sources, in their order of priority
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetadataSource'
        default:
          $ref: '#/components/responses/Error'
  /v1/metadata/{source}/icon:
    get:
      summary: A metadata site's icon
      description: Fetched once and kept in the cache dir, like getProviderIcon.
      operationId: getMetadataIcon
      tags: [v1, metadata]
      x-mangal-scope: read
      parameters:
        - name: source
          in: path
          required: true
          description: the source's key or code (anilist/al, kitsu/kt, mal, mangaupdates/mu)
          schema:
            type: string
      responses:
        '200':
          description: the icon
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            image/*:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
  /v1/metadata/{source}/search:
    get:
      summary: Search a metadata source's mangas
      description: The closest match first (with its score), then the source's results; a number (or `id:<n>`) gets the manga with that id. Bind one with setBinding, link it with linkLibraryManga.
      operationId: searchMetadata
      tags: [v1, metadata]
      x-mangal-scope: read
      parameters:
        - name: source
          in: path
          required: true
          description: the source's key or code (anilist/al, kitsu/kt, mal)
          schema:
            type: string
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: the mangas found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetadataResult'
        default:
          $ref: '#/components/responses/Error'

  /v1/history:
    get:
      summary: The read chapters, last read first
      operationId: listHistory
      tags: [v1, history]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/ProviderParam'
        - $ref: '#/components/parameters/MangaIDParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: the reads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadList'
        default:
          $ref: '#/components/responses/Error'
  /v1/history/clear:
    post:
      summary: Forget the read history (of a provider, or its manga)
      operationId: clearHistory
      tags: [v1, history, changes]
      x-mangal-scope: write
      x-mangal-plan: true
      parameters:
        - $ref: '#/components/parameters/ApplyParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoryClearRequest'
      responses:
        '200':
          $ref: '#/components/responses/Change'
        default:
          $ref: '#/components/responses/Error'

  /v1/config:
    get:
      summary: The config, secrets masked
      operationId: listConfig
      tags: [v1, config]
      x-mangal-scope: read
      responses:
        '200':
          description: every key
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfigEntry'
        default:
          $ref: '#/components/responses/Error'
  /v1/config/{key}:
    put:
      summary: Set a key in the config file (not secrets)
      description: |
        `applies` says when the server uses it: now (the watch.* keys, from the next
        scheduler cycle) or restart. Secret keys aren't set over HTTP (403).
      operationId: setConfig
      tags: [v1, config]
      x-mangal-scope: write
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigSetRequest'
      responses:
        '200':
          description: the key as set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigEntry'
        default:
          $ref: '#/components/responses/Error'

  /v1/accounts:
    get:
      summary: The accounts' status (no logins over HTTP)
      description: The providers' accounts as last fetched (no request to the sites).
      operationId: listAccounts
      tags: [v1, accounts]
      x-mangal-scope: read
      responses:
        '200':
          description: the accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        default:
          $ref: '#/components/responses/Error'

  /v1/watches:
    get:
      summary: The watches
      description: Also GET /api/watches.
      operationId: listWatches
      tags: [v1, watches]
      x-mangal-scope: read
      responses:
        '200':
          description: the watches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Watch'
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Watch a manga
      operationId: addWatch
      tags: [v1, watches]
      x-mangal-scope: watch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddWatchRequest'
      responses:
        '201':
          description: the watch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watch'
        default:
          $ref: '#/components/responses/Error'
  /v1/watches/stale:
    get:
      summary: The watches without a new chapter for a while
      operationId: listStaleWatches
      tags: [v1, watches]
      x-mangal-scope: read
      parameters:
        - name: since
          in: query
          description: a duration (90d by default)
          schema:
            type: string
      responses:
        '200':
          description: the watches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Watch'
        default:
          $ref: '#/components/responses/Error'
  /v1/watches/{id}:
    get:
      summary: A watch
      operationId: getWatch
      tags: [v1, watches]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: the watch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watch'
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: Pause, resume or change a watch
      operationId: updateWatch
      tags: [v1, watches]
      x-mangal-scope: watch
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchWatchRequest'
      responses:
        '200':
          description: the watch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watch'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Stop watching (the history stays)
      operationId: removeWatch
      tags: [v1, watches]
      x-mangal-scope: watch
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '204':
          description: removed
        default:
          $ref: '#/components/responses/Error'
  /v1/watches/{id}/relink:
    post:
      summary: Point a watch to another manga
      operationId: relinkWatch
      tags: [v1, watches]
      x-mangal-scope: watch
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelinkRequest'
      responses:
        '200':
          description: the watch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watch'
        default:
          $ref: '#/components/responses/Error'
  /v1/watches/{id}/hold:
    post:
      summary: Mark a watch (its library manga) on hold or as needing another provider
      description: hiatus and ended check the watches once more (synchronously, unless no_check), then pause them; provider marks them as needing another provider; an empty mark clears the marks and resumes the watches the hold paused.
      operationId: holdWatch
      tags: [v1, watches]
      x-mangal-scope: watch
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldRequest'
      responses:
        '200':
          description: what was marked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldResult'
        default:
          $ref: '#/components/responses/Error'
  /v1/check:
    post:
      summary: Check watches now
      description: A dry run answers 200 with the report, a check 202 with its run (409 when every provider is busy).
      operationId: checkWatches
      tags: [v1, watches]
      x-mangal-scope: watch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckRequest'
      responses:
        '200':
          description: the dry run's report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckReport'
        '202':
          description: the check run started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/runs:
    get:
      summary: The check runs, newest first
      operationId: listRuns
      tags: [v1, watches]
      x-mangal-scope: read
      parameters:
        - name: since
          in: query
          description: a time (RFC 3339) or a duration ago (7d, 12h)
          schema:
            type: string
        - name: watch
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - $ref: '#/components/parameters/ProviderParam'
        - $ref: '#/components/parameters/MangaIDParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: the runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CheckRun'
        default:
          $ref: '#/components/responses/Error'
  /v1/runs/{id}:
    get:
      summary: A check run with its watches' results
      operationId: getRun
      tags: [v1, watches]
      x-mangal-scope: read
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: the run (finished once finished is set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckRun'
        default:
          $ref: '#/components/responses/Error'
  /v1/runs/{id}/cancel:
    post:
      summary: Cancel a check asked through the API
      operationId: cancelRun
      tags: [v1, watches]
      x-mangal-scope: watch
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '202':
          description: cancelled
        default:
          $ref: '#/components/responses/Error'
  /v1/watch-runs/{id}:
    delete:
      summary: Remove a watch's run from the history
      operationId: removeWatchRun
      tags: [v1, watches]
      x-mangal-scope: watch
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: what was removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemovedRun'
        default:
          $ref: '#/components/responses/Error'

components:
  parameters:
    KindParam:
      name: kind
      in: path
      required: true
      description: check, sources, urls, scan or health
      schema:
        type: string
    IDParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ApplyParam:
      name: apply
      in: query
      description: apply the change (needs `expect`, the hash of the plan confirmed), else only plan it
      schema:
        type: boolean
    LimitParam:
      name: limit
      in: query
      description: at most this many (0 for all)
      schema:
        type: integer
        minimum: 0
    LogLimitParam:
      name: limit
      in: query
      description: the last this many (0 for all)
      schema:
        type: integer
        minimum: 0
        maximum: 10000
    OffsetParam:
      name: offset
      in: query
      description: skip this many first
      schema:
        type: integer
        minimum: 0
    ProviderParam:
      name: provider
      in: query
      description: a provider id
      schema:
        type: string
    MangaIDParam:
      name: manga_id
      in: query
      description: a provider's manga id (with provider)
      schema:
        type: string
    MangaIDRequiredParam:
      name: manga_id
      in: query
      required: true
      description: the provider's manga id
      schema:
        type: string
    ChapterPathParam:
      name: path
      in: query
      required: true
      description: the chapter's file, as the manga's chapters list it (download.path)
      schema:
        type: string
    PageParam:
      name: page
      in: path
      required: true
      description: the page's index, 0-based
      schema:
        type: integer
        minimum: 0
    ChapterNumberParam:
      name: chapter
      in: query
      required: true
      description: the chapter's number
      schema:
        type: number
        format: float
    VolumeNumberParam:
      name: volume
      in: query
      description: the chapter's volume number, when several volumes have the number
      schema:
        type: number
        format: float
    ProviderPathParam:
      name: provider
      in: path
      required: true
      description: a provider id
      schema:
        type: string

  responses:
    Error:
      description: |
        An error: invalid 400, unauthorized 401, forbidden 403 (missing scope, refused
        origin), not_found 404, plan_changed 409 (with the new plan), refused 409 (with
        reasons), busy 409, exists 409, unprocessable 422, confirm_required 428,
        rate_limited 429, unavailable 503.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Change:
      description: the plan (applied false), or what the apply did
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChangeResponse'

  schemas:
    LoginRequest:
      type: object
      required: [name, password]
      properties:
        name:
          type: string
        password:
          type: string
        remember:
          type: boolean
    User:
      type: object
      required: [name, perms, admin, created]
      properties:
        name:
          type: string
        perms:
          type: array
          items:
            type: string
        admin:
          type: boolean
          description: every permission (manages the users)
        created:
          type: string
          format: date-time
        last_login:
          type: string
          format: date-time
    NewUser:
      type: object
      required: [name, password]
      properties:
        name:
          type: string
        password:
          type: string
        perms:
          type: array
          items:
            type: string
    UserChange:
      type: object
      properties:
        password:
          type: string
        perms:
          type: array
          items:
            type: string
    Token:
      type: object
      required: [name, scopes, created]
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        created:
          type: string
          format: date-time
    NewToken:
      type: object
      required: [name]
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
    NewTokenResponse:
      type: object
      required: [token, secret]
      properties:
        token:
          $ref: '#/components/schemas/Token'
        secret:
          type: string
          description: Authorization Bearer, shown only here
    Me:
      type: object
      required: [name, kind, scopes]
      properties:
        name:
          type: string
          description: the user's or the API token's name
        kind:
          type: string
          enum: [user, token, local, none]
          description: a user, an API token, the server's own CLI and TUI (local), or serve.auth none
        scopes:
          type: array
          items:
            type: string
    Provider:
      type: object
      required:
        - id
        - version
        - name
      properties:
        name:
          type: string
        id:
          type: string
        description:
          type: string
        version:
          type: string
        website:
          type: string
        icon:
          type: string
          description: the url of the site's icon, none for the website's /favicon.ico (getProviderIcon serves it)
        mirrors:
          type: array
          description: the other websites it can use (providers.mirrors)
          items:
            type: string
        preferred:
          type: string
          description: the preferred website (providers.mirrors), the website when none is set
    MirrorRequest:
      type: object
      required: [mirror]
      properties:
        mirror:
          type: string
          description: the website or one of the mirrors, empty for the default
    ProvidersUpdate:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderUpdate'
        problems:
          type: array
          description: providers that couldn't be loaded after
          items:
            type: string
    ProviderUpdate:
      type: object
      required: [dir, status]
      properties:
        dir:
          type: string
          description: the provider's directory
        status:
          type: string
          description: updated, up to date, skipped (not a git repository or no remote) or failed
        error:
          type: string

    MetadataSource:
      type: object
      required: [code, key, name, url, enabled]
      properties:
        code:
          type: string
          description: al, kt, mal (Binding.source)
        key:
          type: string
        name:
          type: string
        url:
          type: string
          description: the page of a manga, the id appended
        enabled:
          type: boolean
        reason:
          type: string
          description: why it can't be searched (not enabled, no API client)
    MetadataResult:
      type: object
      required: [source, id, title, url, score, bad]
      properties:
        source:
          type: string
          description: the source's code
        id:
          type: string
        title:
          type: string
        alternate_titles:
          type: array
          items:
            type: string
        year:
          type: integer
        format:
          type: string
        status:
          type: string
        chapters:
          type: integer
        cover:
          type: string
        url:
          type: string
        authors:
          type: array
          items:
            type: string
        score:
          type: number
          format: double
          description: how close it is to the query, 0 to 1
        bad:
          type: boolean
          description: too unlike the query to be used automatically (it can still be picked)

    Manga:
      type: object
      required:
        - title
        - id
      properties:
        id:
          type: string
        title:
          type: string
        url:
          type: string
        banner:
          type: string
        cover:
          type: string

    Format:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        extension:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: invalid, unauthorized, forbidden, not_found, exists, busy, plan_changed, refused, confirm_required, nothing_to_do, unprocessable, rate_limited, unavailable, run_not_found, run_unfinished
        reasons:
          type: array
          items:
            type: string
        plan:
          $ref: '#/components/schemas/Plan'
        confirm:
          type: string
          description: what `confirm` has to say (confirm_required)

    Index:
      type: object
      required: [api_version, version, operations]
      properties:
        api_version:
          type: string
        version:
          type: string
        operations:
          type: array
          items:
            $ref: '#/components/schemas/IndexOperation'
    IndexOperation:
      type: object
      required: [method, path, operation_id, scope, summary]
      properties:
        method:
          type: string
        path:
          type: string
        operation_id:
          type: string
        scope:
          type: string
        plan:
          type: boolean
          description: a plan/apply operation (the scope is for apply)
        summary:
          type: string

    Status:
      type: object
      required: [server, checking, api_version, features, scopes, auth]
      properties:
        server:
          type: boolean
        address:
          type: string
        version:
          type: string
        started:
          type: string
          format: date-time
        checking:
          type: boolean
        since:
          type: string
          format: date-time
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderStatus'
        run:
          type: integer
          format: int64
        runs:
          type: array
          items:
            type: integer
            format: int64
        next_check:
          type: string
          format: date-time
        api_version:
          type: string
        features:
          type: array
          description: the features (core.Features names) the API has
          items:
            type: string
        scopes:
          type: array
          description: the scopes of this request
          items:
            type: string
        auth:
          type: string
          description: how this request is authorized (token <name>, loopback, none)
        event_seq:
          type: integer
          format: uint64
          description: the seq of the last event, where a new events subscriber starts (since)
    ProviderStatus:
      type: object
      x-go-type: watch.ProviderStatus
      x-go-type-import:
        path: github.com/luevano/mangal/v5/client/watch
      properties:
        provider:
          type: string
        since:
          type: string
          format: date-time
        pid:
          type: integer
        host:
          type: string
        run:
          type: integer
          format: int64
        watch:
          type: integer
          format: int64
        title:
          type: string
        state:
          type: string

    Event:
      type: object
      required: [seq, time, topic, kind]
      properties:
        seq:
          type: integer
          format: uint64
        time:
          type: string
          format: date-time
        topic:
          type: string
          description: watch, job, op, health or log
        kind:
          type: string
          description: |
            watch and health: the watch.LiveEvent kind; job: added, changed, removed; op:
            done, undone; log: the level
        message:
          type: string
        data:
          description: the topic's object (watch.LiveEvent, Job, Op, LogEntry)
          anyOf:
            - $ref: '#/components/schemas/LiveEvent'
            - $ref: '#/components/schemas/Job'
            - $ref: '#/components/schemas/Op'
            - $ref: '#/components/schemas/LogEntry'

    MetadataID:
      type: object
      required: [source, id]
      properties:
        source:
          type: string
